function go(i,b){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#sec'+i).scrollIntoView({behavior:'smooth',block:'start'})}
function getItem(id){let [base]=id.split('|');let [a,b]=base.split('-').map(Number);return menuData[a].items[b]}function add(id){let [a]=id.split('-').map(Number);if(menuData[a].category==='花茶／咖啡'&&['美式咖啡','拿鐵','卡布奇諾'].includes(getItem(id)[0])){pendingCoffee=id;document.querySelector('#syrupFor').textContent='「'+getItem(id)[0]+'」要加糖漿嗎？';document.querySelector('#syrupModal').classList.add('show');return}if(menuData[a].category==='義大利麵'){pendingPasta=id;document.querySelector('#pastaFor').textContent='為「'+getItem(id)[0]+'」選擇麵體、份量與套餐。';document.querySelector('#pastaModal').classList.add('show');return}if(menuData[a].category==='手工早午餐'){pendingBrunch=id;document.querySelector('#drinkFor').textContent='為「'+getItem(id)[0]+'」選擇一杯加購飲料：';document.querySelector('#drinkSelect').innerHTML='<option value="" selected disabled>請選擇飲料</option>'+drinks.map((d,i)=>`<option value="${i}">${d[0]}（${fmt(d[1])}，補 ${fmt(Math.max(0,d[1]-65))}）</option>`).join('');document.querySelector('#drinkOptions').style.display='none';document.querySelector('#drinkSelect').onchange=()=>{let v=document.querySelector('#drinkSelect').value;document.querySelector('#drinkOptions').style.display=v===''?'none':'block';let name=drinks[Number(v)]?.[0];let sugarOk=['茉香綠茶','斯里蘭卡紅茶','檸檬紅茶','紅茶鮮乳','綠茶鮮乳','抹茶鮮乳'].includes(name);document.querySelector('#sweetGroup').style.display=sugarOk?'block':'none';};document.querySelector('#drinkModal').classList.add('show');return}cart[id]=(cart[id]||0)+1;updateCart();toast('已加入 '+getItem(id)[0])}function confirmCoffee(){let syrup=document.querySelector('#syrupChoice').value,key=pendingCoffee+'|c:'+syrup;cart[key]=(cart[key]||0)+1;document.querySelector('#syrupModal').classList.remove('show');updateCart();toast('已加入咖啡');pendingCoffee=null}function closeSyrup(){document.querySelector('#syrupModal').classList.remove('show');pendingCoffee=null}function confirmPasta(){let shape=document.querySelector('#pastaShape').value,extra=Number(document.querySelector('#pastaExtra').value),combo=Number(document.querySelector('#pastaCombo').value),key=pendingPasta+'|p:'+encodeURIComponent(shape)+'~'+extra+'~'+combo;cart[key]=(cart[key]||0)+1;document.querySelector('#pastaModal').classList.remove('show');updateCart();toast('已加入義大利麵');pendingPasta=null}function closePasta(){document.querySelector('#pastaModal').classList.remove('show');pendingPasta=null}function confirmBrunch(){let di=document.querySelector('#drinkSelect').value;if(di===''){toast('請先選擇一杯飲料');return}let ice=document.querySelector('#drinkIce').value,sweet=document.querySelector('#drinkSweet').value,suffix=`|d:${di}~${encodeURIComponent(ice)}~${encodeURIComponent(sweet)}`, key=pendingBrunch+suffix;cart[key]=(cart[key]||0)+1;document.querySelector('#drinkModal').classList.remove('show');updateCart();toast('已加入早午餐與飲料');pendingBrunch=null}function closeDrink(){document.querySelector('#drinkModal').classList.remove('show');pendingBrunch=null}function linePrice(k){let base=getItem(k)[2],parts=k.split('|');if(parts[1]?.startsWith('d:'))return base+Math.max(0,drinks[Number(parts[1].slice(2).split('~')[0])][1]-65);if(parts[1]?.startsWith('p:')){let [,extra,combo]=parts[1].slice(2).split('~');return base+Number(extra)+Number(combo)}return base}function drinkName(k){let p=k.split('|');if(p[1]?.startsWith('c:'))return p[1]==='c:yes'?'加糖漿':'不加糖漿';if(p[1]?.startsWith('d:')){let [i,ice,sweet]=p[1].slice(2).split('~');return `${drinks[Number(i)][0]}／${decodeURIComponent(ice)}／${decodeURIComponent(sweet)}`;}if(p[1]?.startsWith('p:')){let [shape,extra,combo]=p[1].slice(2).split('~');return `${decodeURIComponent(shape)}${Number(extra)===20?'／加麵':Number(extra)===39?'／焗烤':''}${Number(combo)?`／套餐${Number(combo)===95?'A':Number(combo)===125?'B':'C'}`:''}`}return ''}function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];updateCart()}
function updateCart(){let keys=Object.keys(cart),n=keys.reduce((a,k)=>a+cart[k],0),sum=keys.reduce((a,k)=>a+linePrice(k)*cart[k],0),delivery=mode==='外送'&&sum>0?30:0;document.querySelector('#headcount').textContent=n;document.querySelector('#subtotal').textContent=fmt(sum);document.querySelector('#total').textContent=fmt(sum+delivery);document.querySelector('#deliveryrow').style.display=delivery?'flex':'none';document.querySelector('#checkout').disabled=!n;document.querySelector('#cart').innerHTML=n?keys.map(k=>{let it=getItem(k);return `<div class="cartitem"><div><div class="cartname">${it[0]}</div><div class="cartdetail">${fmt(it[2])}${drinkName(k)?` + ${drinkName(k)}（加購後 ${fmt(linePrice(k))}）`:''} × ${cart[k]}</div></div><div class="qty"><button onclick="change('${k}',-1)">−</button><b>${cart[k]}</b><button onclick="change('${k}',1)">+</button></div></div>`}).join(''):`<div class="empty"><span>🍽️</span>還沒有餐點<br>從左側菜單加入喜歡的品項</div>`}
document.querySelectorAll('.mode button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');mode=b.dataset.mode;updateCart()});document.querySelector('#checkout').onclick=()=>{if(mode==='外送'&&Object.keys(cart).reduce((a,k)=>a+getItem(k)[2]*cart[k],0)<200){toast('外送需滿 $200');return}let count=Object.values(cart).reduce((a,b)=>a+b,0),total=document.querySelector('#total').textContent;document.querySelector('#modaltitle').textContent='訂單已建立';document.querySelector('#modaltext').innerHTML=`已選擇<strong>${mode}</strong>，共 ${count} 件餐點，總計 <strong>${total}</strong>。<br>備註：${document.querySelector('#note').value||'無'}<br><br>此頁為點餐介面示範，請將訂單資訊交給店家確認。`;document.querySelector('#modal').classList.add('show')};function closeModal(){document.querySelector('#modal').classList.remove('show')}let tt;function toast(t){let el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),1600)}render();
</script></body></html>
